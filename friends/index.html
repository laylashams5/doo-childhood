<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألغاز دوو الملوّنة</title>
<meta name="description" content="ألغاز تلوين من DoO: لوّن بالأرقام واكتشف الشخصية المخفية في كتاب ثلاثي الأبعاد.">
<meta name="theme-color" content="#e9893f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b1067'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ff6c2c' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<header class="top">
  <button class="brand" id="home" aria-label="غلاف الكتاب"><img alt="DoO"></button>
  <div class="tools">
    <button class="pill ic" id="sound" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.500 9.5z"/><path class="wv" d="M15.500 9a4.200 4.200 0 0 1 0 6M18 6.500a7.800 7.800 0 0 1 0 11"/><path class="mt" d="M16 9.500l5 5M21 9.500l-5 5"/></svg></button>
    <button class="pill" id="openList">كل الألغاز</button>
  </div>
</header>
<div class="start" id="start">
  <button class="cta" id="openBook">افتح الكتاب</button>
  <p>لوّن بالأرقام واكتشف من يختبئ في كل صفحة</p>
</div>
<nav class="dock" id="dock" aria-label="تصفح الكتاب">
  <div class="chips" id="chips"></div>
  <div class="row">
    <button class="nav" id="prev" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="cta add" id="add">حلّ اللغز</button>
    <button class="nav" id="next" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
</nav>
<div class="lookbar" id="lookbar">
  <p id="prog"></p>
  <div class="pal" id="pal" role="group" aria-label="الألوان"></div>
  <div class="win"><p class="who"><span>ظهر لك</span><b id="who"></b></p><p>الآن دورك: كمّلها على الورق</p></div>
  <div class="acts">
    <button class="pill" id="closeLook">رجوع</button>
    <button class="pill" id="wipe">من جديد</button>
    <button class="pill sv" id="save">حفظ</button>
    <a class="pill hot sv" id="book" target="_blank" rel="noopener">احجز ورشتك</a>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<aside class="sheet" id="list" role="dialog" aria-modal="true" aria-label="كل الألغاز" inert>
  <div class="sheetHead"><h2>كل الألغاز</h2><button class="x" data-close aria-label="إغلاق">×</button></div>
  <div class="sheetBody" id="listBody"></div>
</aside>
<p class="sr" aria-live="polite" id="live"></p>
<noscript>الكتاب يحتاج JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
